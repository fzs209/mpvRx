name: Build FongMi Patched (mpv DV sink fix)

# Builds the FongMi mpvlib AAR from source inside this repository's CI with
# native-patches/fongmi-mpv-dolby-vision-output-mode.patch applied to FongMi/mpv,
# then builds the FongMi APK against that AAR.
#
# Why: mpvRx consumes mpvlib as a prebuilt AAR (app.gyrolet.mpvlib:mpvlib-fongmi),
# so the fix for "Dolby Vision over mediacodec_embed is audio-only on devices
# without a DV decoder" can only ship by rebuilding the AAR. Stock mpv derives
# the FFmpeg dovi_sink_support flag from the VO's static VO_CAP_NATIVE_DOVI
# capability, so mediacodec_embed always demands a native DV decoder. The patch
# makes the sink a per-session state, enabled only while the session actually
# uses Direct Dolby Vision output (which the app selects from its one-time,
# process-cached decoder capability probe); otherwise FFmpeg falls back to the
# base-layer decoder even under mediacodec_embed.
#
# The native build mirrors Riteshp2001/mpvlibAndroid's own build.yml (branch
# mpv-fongmi), restricted to arm64. FongMi/mpv is NOT pinned to a commit: the
# build uses the fongmi branch head exactly as ci.sh install cloned it, the
# same source the upstream mpvlibAndroid build uses. The Dolby Vision sink
# patch in native-patches/ is maintained against that moving branch head;
# if the branch moves so the patch no longer applies, the patch is refreshed
# rather than the mpv revision being pinned back. mpvlibAndroid's own
# patches (including mpv_video_shaders.patch) are applied in full, exactly
# as upstream applies them.
#
# The APK step resolves mpvlib from a local ivy directory staged by this
# workflow via -PmpvlibReleasesUrl (see settings.gradle.kts); every other
# build keeps using the upstream release.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/fongmi-legacy-gpu-osd-crash

permissions:
  contents: read

concurrency:
  group: build-fongmi-patched-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Patched mpvlib + FongMi APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      # mpvlibAndroid fongmi build environment (mirrors its build.yml).
      MPV_GIT_URL: https://github.com/FongMi/mpv.git
      MPV_GIT_REF: fongmi
      FFMPEG_GIT_URL: https://github.com/FongMi/FFmpeg.git
      LIBPLACEBO_GIT_URL: https://github.com/FongMi/libplacebo.git
      CACHE_MODE: folder
      CACHE_FOLDER: ${{ github.workspace }}/mpvlib/gh-cache
      LIBPLACEBO_CACHE_FOLDER: ${{ github.workspace }}/mpvlib/gh-libplacebo-cache
      CCACHE_DIR: ${{ github.workspace }}/mpvlib/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}/mpvlib
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPRESS: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_DISABLE: "true"
      GRADLE_OPTS: >-
        -Xmx4G
        -Dorg.gradle.daemon=false
        -Dorg.gradle.caching=true
        -Dorg.gradle.parallel=true
        -Dorg.gradle.configureondemand=true

    steps:
      - name: Checkout mpvRx
        uses: actions/checkout@v7
        with:
          # BuildConfig.GIT_COUNT and version metadata need full history.
          fetch-depth: 0

      - name: Generate build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout mpvlibAndroid (fongmi)
        uses: actions/checkout@v7
        with:
          repository: Riteshp2001/mpvlibAndroid
          ref: mpv-fongmi
          path: mpvlib

      - name: Restrict native build to arm64
        shell: bash
        run: |
          set -euo pipefail
          # The FongMi APK ships arm64-v8a only. Both edits must happen before
          # "ci.sh export" so cache identifiers are computed from the edited
          # recipes (ci.sh itself is excluded from the recipe manifest, but
          # its arch list feeds the cache identifier's arch tag).
          python3 - <<'PY'
          from pathlib import Path

          path = Path("mpvlib/buildscripts/include/ci.sh")
          source = path.read_text()
          old = "ci_build_arches=(\n\tarmv7l\n\tarm64\n)"
          assert source.count(old) == 1, "ci_build_arches block not found"
          path.write_text(source.replace(old, "ci_build_arches=(\n\tarm64\n)"))
          print("ci_build_arches restricted to arm64")
          PY
          sed -i 's/^ENABLE_X86_ARCH=true/ENABLE_X86_ARCH=false/' \
            mpvlib/buildscripts/include/build_config.sh
          grep '^ENABLE_X86_ARCH' mpvlib/buildscripts/include/build_config.sh

      - name: Validate mpvlib version
        working-directory: mpvlib
        run: |
          bash buildscripts/version.sh validate
          echo "VERSION_NAME=$(bash buildscripts/version.sh name)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Export mpvlib CI environment
        working-directory: mpvlib
        run: buildscripts/include/ci.sh export >> "$GITHUB_ENV"

      - name: Restore Android SDK cache
        id: android-sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: mpvlib/buildscripts/sdk/
          key: android-sdk-${{ runner.os }}-${{ hashFiles('mpvlib/buildscripts/include/depinfo.sh', 'mpvlib/buildscripts/include/download-sdk.sh') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Restore native prefix cache
        id: native-prefix-cache
        uses: actions/cache/restore@v6
        with:
          path: mpvlib/gh-cache/
          key: native-prefix-${{ runner.os }}-${{ env.CACHE_IDENTIFIER }}
          restore-keys: |
            native-prefix-${{ runner.os }}-

      - name: Restore libplacebo cache
        id: libplacebo-cache
        uses: actions/cache/restore@v6
        with:
          path: mpvlib/gh-libplacebo-cache/
          key: libplacebo-${{ runner.os }}-${{ env.LIBPLACEBO_CACHE_IDENTIFIER }}

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache/restore@v6
        with:
          path: mpvlib/.ccache/
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            ant \
            automake \
            build-essential \
            ccache \
            gcc g++ \
            gcc-multilib \
            libc6-dev-i386 \
            cmake \
            gettext \
            gperf \
            libtool \
            nasm \
            ninja-build \
            pkg-config \
            patch \
            python3 \
            python3-pip \
            unzip \
            wget

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade meson jinja2 jsonschema

      - name: Remove stale SDK symlink restored from cache
        shell: bash
        run: |
          set -euo pipefail
          # The SDK cache above restores mpvlib/buildscripts/sdk/ from a previous run,
          # including the android-sdk-linux symlink an earlier ci.sh install created
          # there. When this run's ci.sh executes `ln -sf $ANDROID_HOME
          # sdk/android-sdk-linux` against that restored symlink-to-a-directory, ln
          # dereferences it and creates the new link INSIDE the real SDK instead:
          # $ANDROID_HOME/sdk pointing back at $ANDROID_HOME, a self-referential
          # loop. Every sdkmanager and Gradle scan then reports each package twice
          # ("inconsistent location", then "Skipping duplicate" - about 2000 warnings
          # per job). Removing the restored symlink lets ci.sh recreate it cleanly.
          if [[ -L mpvlib/buildscripts/sdk/android-sdk-linux ]]; then
            echo "Removing restored SDK symlink so ci.sh can recreate it cleanly"
            rm -f mpvlib/buildscripts/sdk/android-sdk-linux
          fi
          # Belt and braces: drop the loop itself if one is somehow already present.
          if [[ -L "$ANDROID_HOME/sdk" ]]; then
            echo "Removing SDK self-loop at $ANDROID_HOME/sdk"
            sudo rm -f "$ANDROID_HOME/sdk"
          fi

      - name: Download and restore native dependencies
        working-directory: mpvlib
        run: |
          set -euxo pipefail
          mkdir -p "$CACHE_FOLDER" "$LIBPLACEBO_CACHE_FOLDER"
          buildscripts/include/ci.sh install

      - name: Save Android SDK cache
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: mpvlib/buildscripts/sdk/
          key: android-sdk-${{ runner.os }}-${{ hashFiles('mpvlib/buildscripts/include/depinfo.sh', 'mpvlib/buildscripts/include/download-sdk.sh') }}

      - name: Save native prefix cache
        if: steps.native-prefix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: mpvlib/gh-cache/
          key: native-prefix-${{ runner.os }}-${{ env.CACHE_IDENTIFIER }}

      - name: Save libplacebo cache
        if: steps.libplacebo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: mpvlib/gh-libplacebo-cache/
          key: libplacebo-${{ runner.os }}-${{ env.LIBPLACEBO_CACHE_IDENTIFIER }}

      - name: Apply Dolby Vision sink patch
        shell: bash
        run: |
          set -euxo pipefail
          mpv_dir="mpvlib/buildscripts/deps/mpv"

          # ci.sh install cloned the fongmi branch; use that branch head
          # as-is (no commit pin). The sink patch is maintained against
          # the moving branch head.
          echo "mpv revision: $(git -C "$mpv_dir" rev-parse HEAD)"
          git -C "$mpv_dir" apply --check \
            "$GITHUB_WORKSPACE/native-patches/fongmi-mpv-dolby-vision-output-mode.patch"
          git -C "$mpv_dir" apply \
            "$GITHUB_WORKSPACE/native-patches/fongmi-mpv-dolby-vision-output-mode.patch"
          git -C "$mpv_dir" diff --stat

      - name: Build AAR for arm64
        working-directory: mpvlib/buildscripts
        run: |
          set -euxo pipefail

          unset ANDROID_SDK_ROOT

          ./buildall.sh --arch arm64 -n mpv
          ./buildall.sh -n mpv-android

      - name: Stage patched AAR as local ivy release
        shell: bash
        run: |
          set -euxo pipefail
          aar="mpvlib/app/build/outputs/aar/app-release.aar"
          test -f "$aar"
          mkdir -p "local-mpvlib/v${VERSION_NAME}"
          cp "$aar" "local-mpvlib/v${VERSION_NAME}/mpvlib-fongmi-${VERSION_NAME}.aar"
          ls -lh "local-mpvlib/v${VERSION_NAME}/"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate release signing secrets
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in SIGNING_KEYSTORE SIGNING_KEY_ALIAS SIGNING_STORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing signing secret::$name is not configured in repository Actions secrets."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Configure all required signing secrets before running the release build."
            exit 1
          fi

      - name: Build FongMi release APK with patched mpvlib
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleFongmiRelease \
            -PtargetAbi="arm64-v8a" \
            -PexperimentalBuild=true \
            -PmpvlibReleasesUrl="$GITHUB_WORKSPACE/local-mpvlib" \
            --stacktrace --no-daemon --max-workers=2

      - name: Sign FongMi ARM64 APK with release certificate
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: d5dde7c8b8a56959f32a4dc03f676f46993be6a6703adc4cd44afeffefddd333
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          test -x "$apksigner"

          for name in SIGNING_KEYSTORE SIGNING_KEY_ALIAS SIGNING_STORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing signing secret::$name is not configured."
              exit 1
            fi
          done

          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > release.keystore
          trap 'rm -f release.keystore' EXIT

          keytool -list -keystore release.keystore \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" >/dev/null

          sign_apk() {
            local dir="$1"
            local base="$2"
            local label="$3"
            local signed="$dir/$base.apk"
            local unsigned="$dir/$base-unsigned.apk"
            local source=""

            if [[ -f "$unsigned" ]]; then
              source="$unsigned"
            elif [[ -f "$signed" ]]; then
              source="$signed"
            else
              echo "Missing expected $label APK: $unsigned (or $signed)"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi

            local staged="$dir/$base-signing.apk"
            rm -f "$staged"
            "$apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$staged" \
              "$source"
            "$apksigner" verify --verbose "$staged"
            cert_report="$("$apksigner" verify --print-certs "$staged")"
            actual_cert_sha256="$(
              sed -n 's/.*certificate SHA-256 digest: //p' <<< "$cert_report" |
                head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':'
            )"
            if [[ "$actual_cert_sha256" != "$EXPECTED_CERT_SHA256" ]]; then
              echo "::error title=Unexpected APK signing certificate::The signed APK certificate does not match the pinned FZS209 release certificate."
              exit 1
            fi
            rm -f "$unsigned"
            mv -f "$staged" "$signed"
          }

          out_dir="app/build/outputs/apk/fongmi/release"
          test -d "$out_dir"
          sign_apk "$out_dir" "app-fongmi-arm64-v8a-release" "fongmi arm64-v8a release"

      - name: Verify expected flavor outputs
        shell: bash
        run: |
          set -euo pipefail
          release_dir="app/build/outputs/apk/fongmi/release"
          if ! compgen -G "$release_dir/app-fongmi-arm64-v8a-release*.apk" >/dev/null; then
            echo "No FongMi APK found for arm64-v8a"
            find "$release_dir" -maxdepth 1 -type f -name '*.apk' -print || true
            exit 1
          fi

      - name: Upload patched FongMi ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: app-fongmi-arm64-v8a-release-patched-${{ steps.metadata.outputs.short_sha }}
          path: app/build/outputs/apk/fongmi/release/app-fongmi-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload patched mpvlib AAR
        uses: actions/upload-artifact@v7
        with:
          name: mpvlib-fongmi-patched-aar-${{ steps.metadata.outputs.short_sha }}
          path: local-mpvlib/v${{ env.VERSION_NAME }}/mpvlib-fongmi-${{ env.VERSION_NAME }}.aar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
